<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1250" viewBox="0 0 760 1250" font-family="'Segoe UI','PingFang SC',Arial,sans-serif">
  <!-- core loop band -->
  <rect x="40" y="16" width="680" height="44" rx="10" fill="rgba(139,200,234,0.15)"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#0E6BA8">Core loop: spec → plan → tasks → implement → verify</text>

  <!-- card 1 setup -->
  <rect x="40" y="76" width="680" height="168" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <circle cx="62" cy="104" r="12" fill="#8BC8EA"/>
  <text x="62" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#0E3560">①</text>
  <text x="82" y="109" font-size="14" font-weight="600" fill="#1A1B1C">Setup · </text>
  <text x="112" y="109" font-size="13" fill="#1A1B1C">init / new</text>
  <text x="696" y="109" text-anchor="end" font-size="11" fill="#6B7280">Human + AI (drafting)</text>
  <text x="56" y="134" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Input</tspan>: project root, PRD</text>
  <text x="56" y="160" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Output</tspan>: spec.md — tri-state FPs ✅/🟡/⚠️ + acceptance + scope</text>
  <text x="56" y="188" font-size="12.5" fill="#0E6BA8">◆ spec quality is owned by the person who writes it; AI drafts, human confirms</text>

  <!-- arrow -->
  <line x1="400" y1="248" x2="400" y2="266" stroke="#8BC8EA" stroke-width="2"/>
  <polygon points="400,274 394,262 406,262" fill="#8BC8EA"/>

  <!-- card 2 validate -->
  <rect x="40" y="274" width="680" height="168" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <circle cx="62" cy="302" r="12" fill="#8BC8EA"/>
  <text x="62" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#0E3560">②</text>
  <text x="82" y="307" font-size="14" font-weight="600" fill="#1A1B1C">Validate spec · </text>
  <text x="142" y="307" font-size="13" fill="#1A1B1C">validate</text>
  <text x="696" y="307" text-anchor="end" font-size="11" fill="#6B7280">speculor-ai (structural)</text>
  <text x="56" y="332" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Input</tspan>: spec.md</text>
  <text x="56" y="358" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Output</tspan>: validation report (structure / id / dependsOn / tri-state)</text>
  <text x="56" y="386" font-size="12.5" fill="#C77D00"><tspan font-weight="600">Gate</tspan>｜pending item → blocks unless confirmed</text>

  <!-- arrow -->
  <line x1="400" y1="446" x2="400" y2="464" stroke="#8BC8EA" stroke-width="2"/>
  <polygon points="400,472 394,460 406,460" fill="#8BC8EA"/>

  <!-- card 3 plan -->
  <rect x="40" y="472" width="680" height="168" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <circle cx="62" cy="500" r="12" fill="#8BC8EA"/>
  <text x="62" y="505" text-anchor="middle" font-size="12" font-weight="700" fill="#0E3560">③</text>
  <text x="82" y="505" font-size="14" font-weight="600" fill="#1A1B1C">Plan alignment · </text>
  <text x="150" y="505" font-size="13" fill="#1A1B1C">plan</text>
  <text x="696" y="505" text-anchor="end" font-size="11" fill="#6B7280">AI generates → tool verifies</text>
  <text x="56" y="530" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Input</tspan>: spec.md; --prompt hands AI the instruction</text>
  <text x="56" y="556" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">AI output</tspan>: plan.md (frontmatter spec/modules/covers + body)</text>
  <text x="56" y="582" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Output</tspan>: alignment report — coverage + confidence + evidence location</text>
  <text x="56" y="610" font-size="12.5" fill="#C77D00"><tspan font-weight="600">Gate</tspan>｜missed / needs-review → blocks with evidence</text>

  <!-- arrow -->
  <line x1="400" y1="644" x2="400" y2="662" stroke="#8BC8EA" stroke-width="2"/>
  <polygon points="400,670 394,658 406,658" fill="#8BC8EA"/>

  <!-- card 4 tasks -->
  <rect x="40" y="670" width="680" height="168" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <circle cx="62" cy="698" r="12" fill="#8BC8EA"/>
  <text x="62" y="703" text-anchor="middle" font-size="12" font-weight="700" fill="#0E3560">④</text>
  <text x="82" y="703" font-size="14" font-weight="600" fill="#1A1B1C">Task completeness · </text>
  <text x="170" y="703" font-size="13" fill="#1A1B1C">tasks</text>
  <text x="696" y="703" text-anchor="end" font-size="11" fill="#6B7280">AI generates → tool verifies</text>
  <text x="56" y="728" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Input</tspan>: plan.md; --prompt hands AI the breakdown</text>
  <text x="56" y="754" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">AI output</tspan>: tasks.md (structured task array + dependsOn)</text>
  <text x="56" y="780" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Output</tspan>: task report — covers all modules + topo order + batches</text>
  <text x="56" y="808" font-size="12.5" fill="#C77D00"><tspan font-weight="600">Gate</tspan>｜missing task / cyclic dependency → blocks</text>

  <!-- arrow -->
  <line x1="400" y1="842" x2="400" y2="860" stroke="#8BC8EA" stroke-width="2"/>
  <polygon points="400,868 394,856 406,856" fill="#8BC8EA"/>

  <!-- card 5 check -->
  <rect x="40" y="868" width="680" height="168" rx="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)"/>
  <circle cx="62" cy="896" r="12" fill="#8BC8EA"/>
  <text x="62" y="901" text-anchor="middle" font-size="12" font-weight="700" fill="#0E3560">⑤</text>
  <text x="82" y="901" font-size="14" font-weight="600" fill="#1A1B1C">Acceptance list · </text>
  <text x="150" y="901" font-size="13" fill="#1A1B1C">check</text>
  <text x="696" y="901" text-anchor="end" font-size="11" fill="#6B7280">speculor-ai (generates)</text>
  <text x="56" y="926" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Input</tspan>: spec.md (acceptance criteria)</text>
  <text x="56" y="952" font-size="13" fill="#4A5568"><tspan font-weight="600" fill="#1A1B1C">Output</tspan>: checklist.md — each item with priority + how-to-verify</text>

  <!-- arrow -->
  <line x1="400" y1="1040" x2="400" y2="1058" stroke="#8BC8EA" stroke-width="2"/>
  <polygon points="400,1066 394,1054 406,1054" fill="#8BC8EA"/>

  <!-- card 6 implement + verify -->
  <rect x="40" y="1066" width="680" height="168" rx="14" fill="rgba(139,200,234,0.10)" stroke="rgba(139,200,234,0.5)"/>
  <circle cx="62" cy="1094" r="12" fill="#52C41A"/>
  <text x="62" y="1099" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">⑥</text>
  <text x="82" y="1099" font-size="14" font-weight="600" fill="#1A1B1C">Implement + verify (beyond the tool)</text>
  <text x="696" y="1099" text-anchor="end" font-size="11" fill="#6B7280">AI codes / human verifies</text>
  <text x="56" y="1124" font-size="13" fill="#4A5568">AI writes code per tasks; human checks off the checklist</text>
  <text x="56" y="1152" font-size="12.5" fill="#0E6BA8">◆ speculor-ai does not check code — it only gates the spec → plan → tasks → acceptance chain</text>
</svg>
